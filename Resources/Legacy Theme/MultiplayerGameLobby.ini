[INISystem]
BasedOn=..\MultiplayerGameLobby.ini

[btnLaunchGame]
IdleTexture=btnGreen133.png
HoverTexture=btnGreen133_c.png
ClickSoundEffect=click.wav

[btnLeaveGame]
IdleTexture=btnRed133.png
HoverTexture=btnRed133_c.png
ClickSoundEffect=click.wav

[btnLockGame]
IdleTexture=btnBlue133.png
HoverTexture=btnBlue133_c.png
ClickSoundEffect=click.wav

[btnPickRandomMap]
; fill the map search row edge to edge, so none of the search field
; shows around the button as a dark rim
$X=getRight(lbMapList) - getWidth($Self)
$Y=getY(lbMapList)
$Height=19
IdleTexture=btnGold75x19.png
HoverTexture=btnGold75x19_c.png
ClickSoundEffect=click.wav

[btnSaveLoadGameOptions]
ClickSoundEffect=click.wav

[btnPlayerExtraOptionsOpen]
ClickSoundEffect=click.wav

[lbChatMessages]
FontIndex=1

[tbChatInput]
FontIndex=1
