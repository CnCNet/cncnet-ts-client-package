; Legacy CnCNet Client theme settings
; Recreates the flat, dark look of the CnCNet ffsun client.
;
; The client always reads its theme settings from a file named
; DTACnCNetClient.ini inside the theme directory, regardless of the theme name.

[General]
; The color of most strings in the UI.
UILabelColor=192,192,192
; The foreground color of usable (buttons, drop-down boxes, chat boxes etc.) UI items.
AltUIColor=240,240,240
; The background color of usable UI items.
AltUIBackgroundColor=26,28,34
; The color into which the font of buttons will change into when you hover over them (in RGB).
ButtonHoverColor=255,255,255
; The color of admins' names on the channel player lists.
AdminNameColor=235,90,90
; The default color of chat messages. Used for messages which lack color information (rare), as well as for private messages.
DefaultChatColor=192,192,192
DefaultPersonalChatColorIndex=1
; The color of sent private messages.
PrivateMessageColor=160,160,160
; The color of received private messages.
PrivateMessageOtherUserColor=143,192,192
ListBoxFocusColor=43,48,104
HoverOnGameColor=35,40,54
; The ffsun client has no outlines around its panels and inputs.
PanelBorderColor=0,0,0,0
WindowBorderColor=0,0,0,0
; Button fade animations (1.0 = disabled)
AlphaRate=1.0
; Check-box tick animations
CheckBoxAlphaRate=0.2
;R,G,B,A
MapPreviewNameBackgroundColor=0,0,0,144
MapPreviewNameBorderColor=0,0,0,0
MainMenuTheme=Default Theme/MainMenuTheme
StartingLocationsUsePlayerRemapColor=yes

[GameLobby]
; Color of the Co-Op briefing text and outline in R,G,B
CoopBriefingForeColor=192,192,192
; Color to use when a non-default option is selected in a combo box.
ComboBoxNondefaultColor=218,165,32

[ParserConstants]
EMPTY_SPACE_TOP=12
EMPTY_SPACE_BOTTOM=11
EMPTY_SPACE_SIDES=22
LOBBY_PANEL_SPACING=10
BUTTON_SPACING=12
CHECKBOX_SPACING=25
