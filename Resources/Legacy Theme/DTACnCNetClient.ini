; Legacy CnCNet Client theme settings
; Recreates the flat, dark look of the CnCNet ffsun client.
;
; The client always reads its theme settings from a file named
; DTACnCNetClient.ini inside the theme directory, regardless of the theme name.

; Colours are drawn from one cool grey ramp, all tinted like 43,47,55:
;
;   surfaces  0,0,0        main menu and loading screen base
;             31,35,42     input background (lists, text boxes, drop-downs)
;             43,47,55     panel background
;             58,63,74     raised (pressed tab, hovered menu plate and game row)
;   controls  105,105,105  fill (buttons, scrollbar, icon plates, trackbar knob)
;             122,122,122  fill, hovered
;   text      211,211,211  labels, glyphs on controls
;             240,240,240  text on controls
;             168,174,184  disabled text, sent private messages
;             138,144,153  hint text
;   accents   34,139,34    green (ForestGreen)     hover 63,156,63
;             178,34,34    red (Firebrick)         hover 193,63,63
;             0,0,205      blue (MediumBlue)       hover 36,36,212
;             218,165,32   gold (Goldenrod)
;             135,206,250  received private messages (LightSkyBlue)
;             43,68,104    list selection

[General]
; The color of most strings in the UI.
UILabelColor=211,211,211
; The foreground color of usable (buttons, drop-down boxes, chat boxes etc.) UI items.
AltUIColor=240,240,240
; The background color of usable UI items. Kept below the 43,47,55 panel value so
; inputs read as recessed. The ffsun client outlines its inputs instead, but the
; client's text boxes only take the one global border color and the borders have
; to stay off for the inputs that sit on the panels.
AltUIBackgroundColor=31,35,42
; The color into which the font of buttons will change into when you hover over them (in RGB).
ButtonHoverColor=255,255,255
; The color of disabled buttons and drop-down items. Must stay clear of the
; 105,105,105 control fill so it reads as text, not as more button.
DisabledButtonColor=168,174,184
; The color of hint text inside empty inputs.
HintTextColor=138,144,153
; The color of multi-column list box headers.
ListBoxHeaderColor=211,211,211
; The color of admins' names on the channel player lists.
AdminNameColor=178,34,34
; The default color of chat messages, the gold accent of the ramp.
DefaultChatColor=218,165,32
DefaultPersonalChatColorIndex=1
; The color of sent private messages.
PrivateMessageColor=168,174,184
; The color of received private messages (LightSkyBlue).
PrivateMessageOtherUserColor=135,206,250
; The selection color for lists and drop-down items.
ListBoxFocusColor=43,68,104
HoverOnGameColor=58,63,74
; The ffsun client has no outlines around its panels and inputs.
PanelBorderColor=0,0,0,0
WindowBorderColor=0,0,0,0
; Button fade animations (1.0 = disabled)
AlphaRate=1.0
; Check-box tick animations
CheckBoxAlphaRate=0.2
;R,G,B,A
MapPreviewNameBackgroundColor=0,0,0,144
MapPreviewNameBorderColor=0,0,0,0
MainMenuTheme=Default Theme/MainMenuTheme
StartingLocationsUsePlayerRemapColor=yes

[GameLobby]
; Color of the Co-Op briefing text and outline in R,G,B
CoopBriefingForeColor=211,211,211
; Color to use when a non-default option is selected in a combo box.
ComboBoxNondefaultColor=218,165,32

[ParserConstants]
EMPTY_SPACE_TOP=12
EMPTY_SPACE_BOTTOM=11
EMPTY_SPACE_SIDES=22
LOBBY_PANEL_SPACING=10
BUTTON_SPACING=12
CHECKBOX_SPACING=25
